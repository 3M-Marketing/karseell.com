<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Meta Pixel: track the completed order using the data saved right before redirect
  if (typeof fbq === 'function') {
    try {
      const lastOrder = JSON.parse(sessionStorage.getItem('karseellLastOrder') || 'null');
      if (lastOrder) {
        fbq('track', 'Purchase', {
          content_name: lastOrder.offerLabel,
          value: lastOrder.total,
          currency: 'EGP'
        });
      }
    } catch (err) {}
  }

  // discount code is valid for 30 days from the moment the customer lands here (right after purchase)
  const expiry = new Date();
  expiry.setDate(expiry.getDate() + 30);
  const formatted = expiry.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('discountExpiry').textContent = 'الكود صالح للاستخدام لحد ' + formatted;

  // copy discount code to clipboard
  const copyBtn = document.getElementById('copyCodeBtn');
  const codeText = document.getElementById('discountCode').textContent.trim();
  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(codeText).then(function () {
      const original = copyBtn.textContent;
      copyBtn.textContent = 'تم النسخ ✓';
      setTimeout(function () { copyBtn.textContent = original; }, 2000);
    }).catch(function () {
      copyBtn.textContent = 'انسخي الكود يدويًا: ' + codeText;
    });
  });
</script>
